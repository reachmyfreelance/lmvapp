<!DOCTYPE html>
<html lang="en">

<head>
    <title>
        LMV - {% block title %}{% endblock %} | AppSeed
    </title>
    <!-- HTML5 Shim and Respond.js IE11 support of HTML5 elements and media queries -->
    <!-- WARNING: Respond.js doesn't work if you view the page via file:// -->
    <!--[if lt IE 11]>
    <script src="https://oss.maxcdn.com/libs/html5shiv/3.7.0/html5shiv.js"></script>
    <script src="https://oss.maxcdn.com/libs/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->
    <!-- Meta -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=0, minimal-ui">
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="description"
          content="Free Datta Able Admin Template come up with latest Bootstrap 4 framework with basic components, form elements and lots of pre-made layout options"/>
    <meta name="keywords"
          content="admin templates, bootstrap admin templates, bootstrap 4, dashboard, dashboard templets, sass admin templets, html admin templates, responsive, bootstrap admin templates free download,premium bootstrap admin templates, datta able, datta able bootstrap admin template, free admin theme, free dashboard template"/>
    <meta name="author" content="CodedThemes"/>

    <!-- Favicon icon -->
    <link rel="icon" href="{{ config.ASSETS_ROOT }}/images/favicon.ico" type="image/x-icon">
    <!-- fontawesome icon -->
    <link rel="stylesheet" href="{{ config.ASSETS_ROOT }}/fonts/fontawesome/css/fontawesome-all.min.css">
    <!-- animation css -->
    <link rel="stylesheet" href="{{ config.ASSETS_ROOT }}/plugins/animation/css/animate.min.css">
    <!-- vendor css -->
    <link rel="stylesheet" href="{{ config.ASSETS_ROOT }}/css/style.css">
    <!-- dark mode css -->
    <link rel="stylesheet" href="{{ config.ASSETS_ROOT }}/css/dark.css">

    <!-- Specific CSS goes HERE -->
    {% block stylesheets %}{% endblock stylesheets %}

</head>
<body>

    <!-- [ Pre-loader ] start -->
    <div class="loader-bg">
        <div class="loader-track">
            <div class="loader-fill"></div>
        </div>
    </div>
    <!-- [ Pre-loader ] End -->

    {% include 'includes/sidebar.html' %}

    {% include 'includes/navigation.html' %}

    <!-- [ Overlay for Popup ] -->
    <div id="overlay" class="overlay"></div>

    <!-- [ Popup ] -->
    <!-- <div id="myPopup" class="popup">
        <div class="popup-content">
            <p id="popupMessage">This is a default message</p>
            <button id="closePopup">Close</button>
        </div>
    </div> -->

    <!-- Trigger Button for Popup (Optional) -->
    <button id="showPopupBtn" style="display:none;">Show Popup</button>

    {% block content %}{% endblock content %}

    {% include 'includes/scripts.html' %}

    <!-- Specific Page JS goes HERE  -->
    {% block javascripts %}{% endblock javascripts %}

    <script>
        // Get references to elements
        const popup = document.getElementById('myPopup');
        const closeBtn = document.getElementById('closePopup');
        const showBtn = document.getElementById('showPopupBtn');
        const popupMessage = document.getElementById('popupMessage');
        const overlay = document.getElementById('overlay');

        // Function to show popup with a custom message
        function showPopup(message) {
            popupMessage.innerText = message; // Set the message
            popup.style.display = 'block'; // Show the popup
            overlay.style.display = 'block'; // Show the overlay
        }

        // Close the popup when the close button is clicked
        closeBtn.onclick = function() {
            popup.style.display = 'none'; // Hide the popup
            overlay.style.display = 'none'; // Hide the overlay
        }

        // Close the popup when the overlay is clicked
        overlay.onclick = function() {
            popup.style.display = 'none'; // Hide the popup
            overlay.style.display = 'none'; // Hide the overlay
        }

        // Trigger the popup by clicking the "Show Popup" button
        showBtn.onclick = function() {
            showPopup("This is a custom message!"); // You can set any message here
        }

        // Show popup automatically when the page loads (if you want it to show on load)
        window.onload = function() {
            showPopup("{{ message }}");  // Dynamically set message from Flask
        };
    </script>
</body>
</html>
