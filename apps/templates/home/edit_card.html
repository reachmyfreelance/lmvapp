{% extends "layouts/base.html" %}

{% block title %} UI Forms {% endblock %} 

<!-- Specific CSS goes HERE -->
{% block stylesheets %}{% endblock stylesheets %}

{% block content %}

    <!-- [ Main Content ] start -->
    <div class="pcoded-main-container">
        <div class="pcoded-wrapper">

            <div class="pcoded-content">
                <div class="pcoded-inner-content">
                    <!-- [ breadcrumb ] start -->
                    <div class="page-header">
                        <div class="page-block">
                            <div class="row align-items-center">
                                <div class="col-md-12">
                                    <div class="page-header-title">
                                        <h5 class="m-b-10">Cards</h5>
                                    </div>
                                    <ul class="breadcrumb">
                                        <li class="breadcrumb-item"><a href="/"><i class="feather icon-home"></i></a></li>
                                        <li class="breadcrumb-item"><a href="/cards">Cards</a></li>
                                        <li class="breadcrumb-item"><a href="javascript:">Add Card</a></li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- [ breadcrumb ] end -->
                    <div class="main-body">
                        <div class="page-wrapper">
                            <!-- [ Main Content ] start -->
                            <div class="row">
                                <div class="col-sm-12">
                                    <div class="card">
                                        <div class="card-body">
                                            <h5>Edit Card</h5>
                                            <hr>
                                            <div class="row">
                                                <div class="col-md-6">
                                                    <form action="/cards/update/{{card.id}}" method='POST'>
                                                        <div class="form-group">
                                                            <label for="card_no">Card Number</label><span class = "mand-asterisk">*</span>
                                                            <input type="name" required class="form-control" id="card_no" name = "card_no" aria-describedby="emailHelp" placeholder="Enter Card Number" value = {{card.card_no}}>
                                                        </div>
                                                        <div class="form-group">
                                                            <label for="company">Company</label><span class = "mand-asterisk">*</span>
                                                            <input type="name" required class="form-control" id="company" name="company" placeholder="Enter Company" value = {{card.company}}>
                                                        </div>
                                                        <div class="form-group">
                                                            <label for="assigned_to">Assigned To</label><span class = "mand-asterisk">*</span>
                                                            <input type="name" required class="form-control" id="assigned_to" name="assigned_to" placeholder="Assigned To" value = {{card.assigned_to}}>
                                                        </div>
                                                        <button type="submit" class="btn btn-primary">Submit</button>
                                                </div>
                                                
                                                    </form>
                                                </div>
                                            </div>
                                            
                                    </div>
                                    
                            </div>
                            <!-- [ Main Content ] end -->
                        </div>
                    </div>
                </div>
            </div>
            
        </div>
    </div>
    <!-- [ Main Content ] end -->

{% endblock content %}

<!-- Specific Page JS goes HERE  -->
{% block javascripts %}{% endblock javascripts %}
