{% extends "layouts/base.html" %}

{% block title %} Edit Driver {% endblock %} 

<!-- Specific CSS goes HERE -->
{% block stylesheets %}{% endblock stylesheets %}

{% block content %}

    <!-- [ Main Content ] start -->
    <div class="pcoded-main-container">
        <div class="pcoded-wrapper">
            <div class="pcoded-content">
                <div class="pcoded-inner-content">
                    <!-- [ breadcrumb ] start -->
                    <div class="page-header">
                        <div class="page-block">
                            <div class="row align-items-center">
                                <div class="col-md-12">
                                    <div class="page-header-title">
                                        <h5 class="m-b-10">Drivers</h5>
                                    </div>
                                    <ul class="breadcrumb">
                                        <li class="breadcrumb-item"><a href="/"><i class="feather icon-home"></i></a></li>
                                        <li class="breadcrumb-item"><a href="/drivers">Drivers</a></li>
                                        <li class="breadcrumb-item"><a href="javascript:">Edit Driver</a></li>
                                    </ul>
                                </div>
                            </div>
                        </div>
                    </div>
                    <!-- [ breadcrumb ] end -->
                    <div class="main-body">
                        <div class="page-wrapper">
                            <!-- [ Main Content ] start -->
                            <div class="row">
                                <div class="col-sm-12">
                                    <div class="card">
                                        <div class="card-body">
                                            <h5>Edit Driver</h5>
                                            <hr>
                                            <div class="row">
                                                <div class="col-md-6">
                                                    <form action="/drivers/update/{{driver.id}}"method="POST" enctype="multipart/form-data">
                                                    
                                                        <!-- Method Override: Simulate PUT -->
                                                    
                                                        <div class="form-group">
                                                            <label for="name">Name</label><span class = "mand-asterisk">*</span>
                                                            <input type="text" required class="form-control" id="name" name="name" value="{{ driver.name }}">
                                                        </div>
                                                    
                                                        <div class="form-group">
                                                            <label for="mobile">Mobile Number</label><span class = "mand-asterisk">*</span>
                                                            <input type="text" required class="form-control" id="mobile" name="mobile" value="{{ driver.mobile }}">
                                                        </div>
                                                    
                                                        <div class="form-group">
                                                            <label for="dl_number">License Number</label><span class = "mand-asterisk">*</span>
                                                            <input type="text" required class="form-control" id="dl_number" name="dl_number" value="{{ driver.dl_number }}">
                                                        </div>
                                                        <button type="submit" class="btn btn-primary">Submit</button>
                                                </div>   
                                                <div class="col-md-6">

                                                    
                                                    <div class="form-group">
                                                        <label>License Image Front</label><span class = "mand-asterisk">*</span>
                                                        <input type="file" required id="files" name="files" class="form-control">
                                                    </div>
                                                    <div class="form-group">
                                                        <label>License Image Back</label><span class = "mand-asterisk">*</span>
                                                        <input type="file" required id="files" name="files" class="form-control">
                                                    </div>
                                                    
                                                    </form>
                                                </div>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <!-- [ Main Content ] end -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <!-- [ Main Content ] end -->

{% endblock content %}

<!-- Specific Page JS goes HERE  -->
{% block javascripts %}{% endblock javascripts %}
